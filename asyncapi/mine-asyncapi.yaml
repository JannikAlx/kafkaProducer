asyncapi: 3.0.0

info:
  title: Mine Service Kafka API
  version: 1.0.0

channels:
  db.mine.ecst.v1:
    address: 'db.mine.ecst.v1'
    title: 'Mine ECST'
    description: Log compacted topic transferring the mine's current state.
    bindings:
      kafka:
        topic: 'db.mine.ecst.v1'
        partitions: 4
        replicas: 3
        topicConfiguration:
          cleanup.policy:
            - compact
    messages:
      mine-ecst:
        $ref: '#/components/messages/mine-ecst'

operations:
  publishMineECST:
    channel:
      $ref: '#/channels/db.mine.ecst.v1'
    action: send
    description: Publishes mine ECST updates.
    messages:
      - $ref: '#/channels/db.mine.ecst.v1/messages/mine-ecst'

components:
  schemas:
    mineId:
      type: string
      format: uuid
      description: A unique id for a mine.

    gameId:
      type: string
      description: A game's unique id.
      format: uuid

    resourceType:
      type: string
      description: Type of resource available in the mine.
      enum:
        - BIO_MATTER
        - CRYO_GAS
        - DARK_MATTER
        - ION_DUST
        - PLASMA_CORES

    resourceAmount:
      type: integer
      minimum: 0
      description: Current amount of resources in the mine.

  messageTraits:
    commonHeaders:
      headers:
        type: object
        properties:
          event_id:
            type: string
            format: uuid
            description: |
              Uniquely identifies an event globally across topics and partitions regardless of its schema. 
              Can be used reliably for duplicate detection.
            examples:
              - a7a26ff2-e851-45b6-9634-d595f45458b7
          entity:
            type: string
            description: |
              Identifies the entity an event belongs to by name and id - primarily for debugging.
              Contains a String in the format of <entity>.<id> with entity and id adhering to [-a-z]+.
            examples:
              - mine.a7a26ff2-e851-45b6-9634-d595f45458b7
          sequence_id:
            type: integer
            format: int64
            description: |
              Identifies the sequence in which events are published or written to the outbox. 
              Consumers may use this number to filter for duplicates, as new events will always have a higher number than previous events.
            examples:
              - 1277129
          created_at:
            type: string
            format: date-time
            description: |
              Identifies the point in time the event was created. 
              In the context of an event outbox, the timestamp was generated the moment the event was written to the outbox.
              Contains a String in the ISO-8601 zoned date time format.
            examples:
              - 2019-08-24T14:15:22Z
          event_type:
            type: string
            description: |
              Identifies the type or schema used for generating the payload.
              Contains a String that matches the schema's name (or Message-ID in AsyncAPI terms). 
              Does not include a version.
            examples:
              - mine-ecst
          event_type_version:
            type: integer
            description: |
              Identifies the type's or schema's version for generating the payload.
              Each AsyncAPI message contains its version as part of its name, for example: Mine ECST V1;
              1 is the message's version.
            minimum: 1
            examples:
              - 1

  messages:
    mine-ecst:
      name: 'mine-ecst'
      title: Mine ECST V1
      summary: Full mine ECST payload
      description: Keyed ECST event publishing the mine's current state.
      contentType: application/json
      bindings:
        kafka:
          key:
            $ref: '#/components/schemas/mineId'
      traits:
        - $ref: '#/components/messageTraits/commonHeaders'
      payload:
        type: object
        properties:
          mineId:
            $ref: '#/components/schemas/mineId'
          gameId:
            $ref: '#/components/schemas/gameId'
          resourceType:
            $ref: '#/components/schemas/resourceType'
          resourceAmount:
            $ref: '#/components/schemas/resourceAmount'
