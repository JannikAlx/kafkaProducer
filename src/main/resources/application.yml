spring:
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      retries: 3
      properties:
        linger.ms: 10
        batch.size: 10

# Application configuration
app:
  topic-name: game-events
  input-directory: ./input

# Game simulation configuration
game:
  simulation:
    player-count: 10
    map-width: 30
    map-height: 30
    blackhole-destruction-chance: 0.3  # 30% chance robot is destroyed when moving to blackhole
    publish-delay-ms: 3  # Small delay between events for readability

logging:
  level:
    com.example.kafka: INFO
    org.apache.kafka: WARN
